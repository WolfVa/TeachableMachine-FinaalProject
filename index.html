<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Reaction Time Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <style>
    @font-face {
      font-family: 'Naluka';
      src: url('naluka.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a5218;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* ═══════════════════════
       SCREEN SYSTEM
    ═══════════════════════ */
    .screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    .screen.active { display: block; }

    /* shared bg */
    .bg {
      position: absolute;
      inset: 0;
      background-color: #1a5218;
      background-image: url('grain_effect_background.png');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* shared leaves */
    .leaves { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .leaf { position: absolute; }
    .leaf-tl { top: -5px;  left: -5px;  width: 40vw; max-width: 155px; transform: rotate(5deg); }
    .leaf-tr { top: -5px;  right: -5px; width: 40vw; max-width: 155px; transform: scaleX(-1) rotate(5deg); }
    .leaf-bl { bottom: -5px; left: -5px;  width: 34vw; max-width: 130px; transform: rotate(-8deg); }
    .leaf-br { bottom: -5px; right: -5px; width: 34vw; max-width: 130px; transform: scaleX(-1) rotate(-8deg); }

    /* home inner — no scroll, fits full screen */
    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 16px 20px 20px;
      gap: 6px;
    }

    /* ═══════════════════════
       HOME SCREEN
    ═══════════════════════ */
    .page-title {
      font-family: 'Naluka', cursive;
      color: #fff;
      font-size: clamp(1.2rem, 6.5vw, 2rem);
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      line-height: 1.1;
      letter-spacing: 1px;
    }

    /* smaller camera, same 3/4 ratio */
    .camera-box {
      width: 55vw;
      max-width: 200px;
      height: 16vh;
      max-height: 120px;
      background: #b8b8b8;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .camera-box video {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .cam-label {
      position: absolute;
      top: 6px; left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      color: #555;
    }

    .description {
      color: #fff;
      text-align: center;
      font-size: clamp(0.72rem, 3.2vw, 0.88rem);
      line-height: 1.5;
      padding: 0 6px;
    }
    .red   { color: #ff4444; font-weight: 700; }
    .green { color: #44ff44; font-weight: 700; }

    /* LOG — smaller */
    .log-wrap {
      position: relative;
      width: 70vw;
      max-width: 260px;
      flex-shrink: 0;
    }
    .log-wrap img { width: 100%; display: block; }
    .log-text {
      position: absolute;
      top: 55%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Naluka', cursive;
      font-size: clamp(0.85rem, 4.5vw, 1.15rem);
      color: #fff;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    /* PLANKS — thinner and closer */
    .planks-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
    }
    .plank-wrap {
      position: relative;
      width: 52vw;
      max-width: 200px;
      flex-shrink: 0;
    }
    .plank-wrap img { width: 100%; display: block; }
    .plank-text {
      position: absolute;
      top: 55%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Naluka', cursive;
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      color: #3b1f00;
      white-space: nowrap;
    }

    /* START BTN */
    .start-btn {
      background: #2a7a2a;
      color: #fff;
      border: none;
      padding: 10px 38px;
      font-family: 'Naluka', cursive;
      font-size: clamp(0.9rem, 4.5vw, 1.1rem);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .start-btn:active { transform: scale(0.97); }

    /* ═══════════════════════
       RED SCREEN
    ═══════════════════════ */
    #screen-red .bg { background-color: #6b0000; }

    #screen-red .border-ring {
      position: absolute; inset: 0;
      border: 20px solid #cc0000;
      z-index: 3; pointer-events: none;
    }
    .fullcam {
      position: absolute; inset: 0; z-index: 1;
    }
    .fullcam video {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.2;
    }
    .big-word {
      position: absolute; inset: 0; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Naluka', cursive;
      font-size: clamp(3rem, 19vw, 5.5rem);
      color: #111;
      letter-spacing: 3px;
    }

    /* ═══════════════════════
       GREEN SCREEN
    ═══════════════════════ */
    #screen-green .bg { background-color: #145214; }
    #screen-green .border-ring {
      position: absolute; inset: 0;
      border: 20px solid #00dd00;
      z-index: 3; pointer-events: none;
    }

    /* ═══════════════════════
       RESULT SCREEN
    ═══════════════════════ */
    #screen-result .bg { background-color: #1a5218; }
    #screen-result .content {
      justify-content: center;
      gap: 4px;
    }

    .result-title {
      font-family: 'Naluka', cursive;
      color: #fff;
      font-size: clamp(1.2rem, 6.5vw, 2rem);
      text-align: center;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
      letter-spacing: 1px;
      line-height: 1.2;
    }
    .divider {
      width: 55%; height: 2px;
      background: rgba(255,255,255,0.35);
      margin: 10px 0;
    }
    .result-time {
      font-size: clamp(2.8rem, 15vw, 4.5rem);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 24px rgba(255,255,255,0.2);
    }
    .result-animal-img {
      width: min(52vw, 190px);
      height: min(52vw, 190px);
      object-fit: contain;
      margin: 8px 0;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
    }
    .result-label {
      font-family: 'Naluka', cursive;
      font-size: clamp(0.95rem, 5vw, 1.25rem);
      color: #fff;
      text-align: center;
      padding: 0 20px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    .retry-btn {
      margin-top: 18px;
      background: #2a7a2a;
      color: #fff;
      border: none;
      padding: 12px 38px;
      font-family: 'Naluka', cursive;
      font-size: clamp(0.9rem, 4.5vw, 1.1rem);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      letter-spacing: 1px;
    }
    .retry-btn:active { transform: scale(0.97); }

    /* ═══════════════════════
       STATUS BAR (debug)
    ═══════════════════════ */
    #status-bar {
      position: fixed;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: #aaffaa;
      font-size: 0.65rem;
      padding: 3px 12px;
      border-radius: 20px;
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════
     SCREEN 1 — HOME
══════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="bg"></div>
  <div class="leaves">
    <img class="leaf leaf-tl" src="leaf_1.png" alt=""/>
    <img class="leaf leaf-tr" src="leaf_2.png" alt=""/>
    <img class="leaf leaf-bl" src="leaf_3.png" alt=""/>
    <img class="leaf leaf-br" src="leaf_1.png" alt=""/>
  </div>
  <div class="content">
    <h1 class="page-title">Reaction Time Test</h1>

    <div class="camera-box">
      <span class="cam-label">camera</span>
      <video id="home-video" autoplay playsinline muted></video>
    </div>

    <p class="description">
      This is a test to see how quickly<br/>
      you can react, the screen will be <span class="red">red</span>.<br/>
      And when the screen turns <span class="green">green</span> you clap.
    </p>

    <div class="log-wrap">
      <img src="log.png" alt=""/>
      <span class="log-text">Leaderboard</span>
    </div>
    <div class="planks-row">
      <div class="plank-wrap">
        <img src="plank.png" alt=""/>
        <span class="plank-text" id="lb-1">1. ---</span>
      </div>
      <div class="plank-wrap">
        <img src="plank.png" alt=""/>
        <span class="plank-text" id="lb-2">2. ---</span>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">Start</button>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN 2 — RED / READY
══════════════════════════════ -->
<div id="screen-red" class="screen">
  <div class="bg"></div>
  <div class="border-ring"></div>
  <div class="fullcam">
    <video id="red-video" autoplay playsinline muted></video>
  </div>
  <div class="big-word">READY?</div>
</div>

<!-- ══════════════════════════════
     SCREEN 3 — GREEN / CLAP
══════════════════════════════ -->
<div id="screen-green" class="screen">
  <div class="bg"></div>
  <div class="border-ring"></div>
  <div class="fullcam">
    <video id="green-video" autoplay playsinline muted></video>
  </div>
  <div class="big-word">CLAP!</div>
</div>

<!-- ══════════════════════════════
     SCREEN 4 — RESULT
══════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="bg"></div>
  <div class="leaves">
    <img class="leaf leaf-tl" src="leaf_1.png" alt=""/>
    <img class="leaf leaf-tr" src="leaf_2.png" alt=""/>
    <img class="leaf leaf-bl" src="leaf_3.png" alt=""/>
    <img class="leaf leaf-br" src="leaf_1.png" alt=""/>
  </div>
  <div class="content">
    <h1 class="result-title">Reaction Time Result</h1>
    <div class="divider"></div>
    <div class="result-time" id="result-time">---ms</div>
    <img id="result-animal-img" class="result-animal-img" src="tijger.png" alt="animal"/>
    <p class="result-label" id="result-label">This is as fast as a Tiger!</p>
    <button class="retry-btn" onclick="goHome()">Try Again</button>
  </div>
</div>

<div id="status-bar">Starting...</div>

<script>
  // ── UTILS ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function status(msg) {
    document.getElementById('status-bar').textContent = msg;
  }

  // ── CAMERA ──
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      ['home-video','red-video','green-video'].forEach(id => {
        document.getElementById(id).srcObject = stream;
      });
    } catch(e) {
      status('Camera unavailable');
    }
  }
  startCamera();

  // ── LEADERBOARD ──
  let leaderboard = [];
  function updateLeaderboard(ms) {
    leaderboard.push(ms);
    leaderboard.sort((a, b) => a - b);
    leaderboard = leaderboard.slice(0, 2);
    document.getElementById('lb-1').textContent = leaderboard[0] != null ? `1. ${leaderboard[0]}ms` : '1. ---';
    document.getElementById('lb-2').textContent = leaderboard[1] != null ? `2. ${leaderboard[1]}ms` : '2. ---';
  }

  // ── ANIMALS ──
  const animals = [
    { name: 'Cheetah', image: 'cheetah.svg', label: 'This is as fast as a Cheetah!', max: 2100      },
    { name: 'Tiger',   image: 'tijger.png',  label: 'This is as fast as a Tiger!',   max: 2200      },
    { name: 'Sloth',   image: 'sloth.svg',   label: 'This is as slow as a Sloth!',   max: Infinity },
  ];
  function getAnimal(ms) { return animals.find(a => ms <= a.max); }

  // ── TEACHABLE MACHINE ──
  // FIX: use full http URL instead of relative path
  // Works both on GitHub Pages and locally via Live Server
  const MODEL_URL = window.location.origin + window.location.pathname.replace('index.html', '') + 'my_model/';
  let recognizer  = null;
  let listening   = false;

  async function loadModel() {
    try {
      status('Loading model...');
      recognizer = speechCommands.create(
        'BROWSER_FFT',
        undefined,
        MODEL_URL + 'model.json',
        MODEL_URL + 'metadata.json'
      );
      await recognizer.ensureModelLoaded();
      // Request mic permission immediately after model loads
      await navigator.mediaDevices.getUserMedia({ audio: true });
      status('Model ready ✓ — mic allowed');
    } catch(e) {
      status('ERROR: ' + e.message);
      console.error(e);
    }
  }
  loadModel();

  // ── GAME ──
  let greenStartTime = null;
  let clapDetected   = false;
  let redTimeout     = null;

  function startGame() {
    if (!recognizer) {
      alert('Model not loaded yet!\nMake sure:\n• You use Live Server\n• my_model/ folder is next to index.html');
      return;
    }
    clapDetected = false;
    greenStartTime = null;
    showScreen('screen-red');
    status('Warming up...');

    // Start listening immediately during red screen so model is warmed up
    startListening();

    // Increased by 1.5s: was 2000-5000ms, now 3500-6500ms
    const delay = 3500 + Math.random() * 3000;
    redTimeout  = setTimeout(() => {
      showScreen('screen-green');
      greenStartTime = Date.now();
      status('Listening for clap...');
    }, delay);
  }

  function startListening() {
    if (!recognizer || listening) return;
    listening = true;

    recognizer.listen(result => {
      const labels = recognizer.wordLabels();
      const scores = result.scores;

      const clapIndex = labels.findIndex(l => l === 'Clap');
      if (clapIndex === -1) {
        status('ERROR: Clap label not found. Labels: ' + labels.join(', '));
        return;
      }

      const clapScore = scores[clapIndex];

      // Only react to claps after green screen has started
      if (greenStartTime === null) return;

      status(`Clap: ${(clapScore * 100).toFixed(0)}% — clap loud!`);

      if (clapScore > 0.60 && !clapDetected) {
        clapDetected = true;
        stopListening();
        const reactionTime = Date.now() - greenStartTime;
        showResult(reactionTime);
      }
    }, {
      includeSpectrogram: true,
      probabilityThreshold: 0.60,
      invokeCallbackOnNoiseAndUnknown: true,
      overlapFactor: 0.50
    });
  }

  function stopListening() {
    if (recognizer && listening) {
      try { recognizer.stopListening(); } catch(e) {}
      listening = false;
    }
  }

  function showResult(ms) {
    updateLeaderboard(ms);
    const animal = getAnimal(ms);
    document.getElementById('result-time').textContent  = ms + 'ms';
    document.getElementById('result-animal-img').src    = animal.image;
    document.getElementById('result-animal-img').alt    = animal.name;
    document.getElementById('result-label').textContent = animal.label;
    showScreen('screen-result');
    status(`Result: ${ms}ms — ${animal.name}`);
  }

  function goHome() {
    stopListening();
    clearTimeout(redTimeout);
    clapDetected   = false;
    greenStartTime = null;
    showScreen('screen-home');
    status('Ready');
  }
</script>
</body>
</html>
